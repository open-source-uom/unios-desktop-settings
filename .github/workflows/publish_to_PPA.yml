name: Publish to Launchpad PPA

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.1, v1.0.2, etc.
  workflow_dispatch: # Allows manual trigger from GitHub UI
  
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      PPA_TARGET: "ppa:unios-team/ppa"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check PPA signing key is configured
        id: key-check
        env:
          PPA_GPG_KEY: ${{ secrets.PPA_GPG_KEY }}
        run: |
          if [ -z "$PPA_GPG_KEY" ]; then
            echo "::warning::No PPA_GPG_KEY repo secret is configured. Skipping build/publish — add PPA_GPG_KEY and PPA_GPG_KEY_PASSPHRASE secrets to enable this."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Debian packaging tools
        if: steps.key-check.outputs.configured == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            devscripts \
            debhelper \
            dh-make \
            dput \
            gnupg

      - name: Import GPG key for signing
        id: gpg
        if: steps.key-check.outputs.configured == 'true'
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.PPA_GPG_KEY }}
          passphrase: ${{ secrets.PPA_GPG_KEY_PASSPHRASE }}

      - name: Derive maintainer identity from debian/changelog
        if: steps.key-check.outputs.configured == 'true'
        run: |
          # Uses whoever last ran `dch` and committed an entry — no
          # hardcoded person, so any contributor with signing rights
          # can cut a release under their own name.
          MAINTAINER="$(dpkg-parsechangelog -S Maintainer)"
          NAME="${MAINTAINER% <*}"
          EMAIL="$(echo "$MAINTAINER" | sed -n 's/.*<\(.*\)>.*/\1/p')"
          echo "MAINTAINER_NAME=$NAME" >> "$GITHUB_ENV"
          echo "MAINTAINER_EMAIL=$EMAIL" >> "$GITHUB_ENV"
          echo "DEBFULLNAME=$NAME" >> "$GITHUB_ENV"
          echo "DEBEMAIL=$EMAIL" >> "$GITHUB_ENV"

      - name: Validate debian/changelog before uploading
        if: steps.key-check.outputs.configured == 'true'
        run: |
          DIST="$(dpkg-parsechangelog -S Distribution)"
          if [ "$DIST" = "UNRELEASED" ]; then
            echo "::error::debian/changelog distribution is UNRELEASED. Set it to an Ubuntu series (e.g. noble) — Launchpad will reject this upload."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            CHANGELOG_VERSION="$(dpkg-parsechangelog -S Version)"
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$CHANGELOG_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::debian/changelog is at $CHANGELOG_VERSION but the tag is $GITHUB_REF_NAME. Launchpad rejects re-uploads of an existing version."
              exit 1
            fi
          fi

      - name: Configure Git identity
        if: steps.key-check.outputs.configured == 'true'
        run: |
          git config user.name "$MAINTAINER_NAME"
          git config user.email "$MAINTAINER_EMAIL"

      - name: Build Debian Source Package
        if: steps.key-check.outputs.configured == 'true'
        run: |
          # Clean untracked files that might interfere with debuild
          git clean -fdx -e .github
          # Build source package (-S). -d skips the build-dependency check:
          # a source-only build doesn't compile anything, and the Qt6 build
          # deps aren't installed on the runner. -sa is a no-op here since
          # this is a native package (no separate orig tarball).
          # Sign with the fingerprint of the key we actually imported.
          debuild -S -sa -d -k"${{ steps.gpg.outputs.fingerprint }}"

      - name: Upload to Launchpad PPA via dput
        if: steps.key-check.outputs.configured == 'true'
        run: |
          CHANGES_FILE=$(ls ../*_source.changes | head -n 1)
          echo "Uploading $CHANGES_FILE to $PPA_TARGET..."
          dput -f "$PPA_TARGET" "$CHANGES_FILE"